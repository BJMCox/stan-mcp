[workspace]
name = "stan-mcp"
version = "0.1.0"
description = "MCP server for compiling, inspecting, and running Stan models (BridgeStan + CmdStanPy)"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[tasks]
serve = "python -m stan_mcp"
test = "pytest -q"
test-live = "STAN_MCP_LIVE=1 pytest -q tests/test_live_smoke.py tests/test_batch_eval.py tests/test_batch_live.py"
lint = "ruff check ."
format = "ruff format ."
typecheck = "pyright"

[dependencies]
python = ">=3.15.2,<3.16"
cxx-compiler = "*"
make = "*"
numpy = "*"
arviz = "*"
# xarray stays: arviz is built on it. netcdf4 does not -- it was needed only by
# the to_netcdf/from_netcdf calls the draws sidecar replaced.
xarray = "*"
pytest = "*"
pytest-asyncio = "*"
ruff = "*"
pyright = "*"
psutil = ">=7.2.2,<8"

[pypi-dependencies]
mcp = ">=2.3,<3"
bridgestan = "*"
cmdstanpy = "*"
stanio = ">=0.5.1, <0.6"
safetensors = ">=0.8.0, <0.9"
