[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["stan_mcp", "tests", "examples", "server.py"]
exclude = ["**/.pixi", "**/__pycache__"]
venvPath = ".pixi/envs"
venv = "default"
pythonVersion = "3.15"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
